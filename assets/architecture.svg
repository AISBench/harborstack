<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="harborstack 端到端流程">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .lane-a { fill: #f2f7ff; stroke: #d3e4fd; stroke-width: 1.3; }
      .lane-b { fill: #f8f5ff; stroke: #e4dcff; stroke-width: 1.3; }
      .lane-c { fill: #f0fdf6; stroke: #c6f6dd; stroke-width: 1.3; }

      .pill-a { fill: #dbeafe; }
      .pill-b { fill: #ede9fe; }
      .pill-c { fill: #d1fae5; }

      .card      { fill: #ffffff; stroke-width: 2; filter: url(#card-shadow); }
      .card-eval { stroke: #60a5fa; }
      .card-conv { stroke: #a78bfa; }
      .card-store{ stroke: #34d399; }

      .t      { font-size: 14px; font-weight: 700; }
      .t-eval { fill: #1d4ed8; }
      .t-conv { fill: #6d28d9; }
      .t-store{ fill: #047857; }
      .s      { fill: #475569; font-size: 12px; }

      .flow   { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .flow-g { stroke: #059669; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-green); }

      .hint   { fill: #64748b; font-size: 11.5px; }
      .legend { fill: #475569; font-size: 12px; }
      .note   { fill: #64748b; font-size: 12px; }

      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="480" fill="#ffffff"/>

  <!-- ===== 泳道 ===== -->
  <rect class="lane-a" x="20" y="64" width="312" height="340" rx="14"/>
  <rect class="lane-b" x="348" y="64" width="524" height="340" rx="14"/>
  <rect class="lane-c" x="888" y="64" width="292" height="340" rx="14"/>

  <rect class="pill-a" x="44" y="78" width="112" height="30" rx="15"/>
  <text class="t t-eval" x="100" y="98" text-anchor="middle" font-size="13">① 评测执行</text>

  <rect class="pill-b" x="380" y="78" width="214" height="30" rx="15"/>
  <text class="t t-conv" x="487" y="98" text-anchor="middle" font-size="13">② ATIF → OTel 转换与导入</text>

  <rect class="pill-c" x="916" y="78" width="128" height="30" rx="15"/>
  <text class="t t-store" x="980" y="98" text-anchor="middle" font-size="13">③ 可观测平台</text>

  <!-- ===== 主链 ===== -->
  <rect class="card card-eval" x="44" y="140" width="128" height="68" rx="10"/>
  <text class="t t-eval" x="108" y="168" text-anchor="middle">harbor run</text>
  <text class="s" x="108" y="188" text-anchor="middle">评测执行</text>

  <rect class="card card-eval" x="192" y="132" width="124" height="84" rx="10"/>
  <text class="t t-eval" x="254" y="160" text-anchor="middle">trial 产物</text>
  <text class="s" x="254" y="180" text-anchor="middle">trajectory.json</text>
  <text class="s" x="254" y="200" text-anchor="middle">result.json</text>

  <rect class="card card-conv" x="380" y="140" width="100" height="68" rx="10"/>
  <text class="t t-conv" x="430" y="168" text-anchor="middle">scan</text>
  <text class="s" x="430" y="188" text-anchor="middle">发现 trial</text>

  <rect class="card card-conv" x="504" y="140" width="112" height="68" rx="10"/>
  <text class="t t-conv" x="560" y="168" text-anchor="middle">plan</text>
  <text class="s" x="560" y="188" text-anchor="middle">ATIF → OTel</text>

  <rect class="card card-conv" x="640" y="140" width="112" height="68" rx="10"/>
  <text class="t t-conv" x="696" y="168" text-anchor="middle">export</text>
  <text class="s" x="696" y="188" text-anchor="middle">OTLP / HTTP</text>

  <rect class="card card-store" x="916" y="132" width="236" height="84" rx="10"/>
  <text class="t t-store" x="1034" y="160" text-anchor="middle">Langfuse</text>
  <text class="s" x="1034" y="180" text-anchor="middle">ClickHouse · traces</text>
  <text class="s" x="1034" y="200" text-anchor="middle">Experiments · scores</text>

  <!-- ===== 分支 ===== -->
  <rect class="card card-conv" x="504" y="268" width="112" height="68" rx="10"/>
  <text class="t t-conv" x="560" y="296" text-anchor="middle">scores</text>
  <text class="s" x="560" y="316" text-anchor="middle">reward 回填</text>

  <rect class="card card-conv" x="640" y="268" width="112" height="68" rx="10"/>
  <text class="t t-conv" x="696" y="296" text-anchor="middle">report</text>
  <text class="s" x="696" y="316" text-anchor="middle">对账与留档</text>

  <!-- ===== 泳道辅助说明 ===== -->
  <text class="hint" x="176" y="318" text-anchor="middle">工作区与分支由调用方固定</text>
  <text class="hint" x="1034" y="318" text-anchor="middle">按 run 聚合成 Experiment</text>

  <!-- ===== 连线 ===== -->
  <!-- 主链统一 y=174，首尾留 6px 间隙给箭头 -->
  <path class="flow" d="M172 174 H186"/>
  <path class="flow" d="M316 174 H374"/>
  <path class="flow" d="M480 174 H498"/>
  <path class="flow" d="M616 174 H634"/>
  <path class="flow" d="M752 174 H910"/>

  <!-- plan / export 向下分支 -->
  <path class="flow" d="M560 208 V262"/>
  <path class="flow" d="M696 208 V262"/>

  <!-- scores → Langfuse：从分支行下方绕行，避开 report 卡片与泳道说明 -->
  <path class="flow-g" d="M560 336 V368 H1128 V222"/>

  <!-- ===== 图例 ===== -->
  <circle cx="44" cy="444" r="5" fill="#60a5fa"/>
  <text class="legend" x="58" y="448">评测执行</text>
  <circle cx="152" cy="444" r="5" fill="#a78bfa"/>
  <text class="legend" x="166" y="448">转换与上报</text>
  <circle cx="284" cy="444" r="5" fill="#34d399"/>
  <text class="legend" x="298" y="448">存储与展示</text>

  <text class="note" x="600" y="448">一条 display 命令完成 ② 全流程 · 每次 run 在 ③ 中独立成 Experiment</text>
</svg>
